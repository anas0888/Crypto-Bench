<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptographic Performance Analyzer</title>
    <!-- Bootstrap CSS for layout and basic styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container main-container mt-5 mb-5 p-5">
        <h1 class="text-center mb-4 header-title">Cryptographic Performance Analyzer</h1>

        <div class="card glass-card p-4 mb-4">
            <h5 class="card-title">Configuration</h5>
            
            <div class="mb-3">
                <label for="algorithmSelect" class="form-label">Algorithm</label>
                <select class="form-select custom-select" id="algorithmSelect">
                    <option value="AES">AES-256</option>
                    <option value="RSA">RSA-2048</option>
                    <option value="SHA256">SHA-256</option>
                    <option value="SHA512">SHA-512</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="inputText" class="form-label">Input Text</label>
                <textarea class="form-control custom-textarea" id="inputText" rows="4" placeholder="Enter text to process..."></textarea>
            </div>

            <div class="d-grid">
                <button class="btn btn-primary custom-btn" id="runBtn">
                    <span class="btn-text">Run Algorithm</span>
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="card glass-card p-4 mb-4" id="resultsSection" style="display: none;">
            <h5 class="card-title mb-3">Results</h5>
            
            <div class="row">
                <div class="col-md-6 mb-2">
                    <strong>Algorithm:</strong> <span id="resAlgorithm" class="text-highlight"></span>
                </div>
                <div class="col-md-6 mb-2">
                    <strong>Execution Time:</strong> <span id="resTime" class="text-highlight"></span>
                </div>
                <div class="col-md-6 mb-2">
                    <strong>Memory Usage:</strong> <span id="resMemory" class="text-highlight"></span>
                </div>
                <div class="col-md-6 mb-2">
                    <strong>Output Size:</strong> <span id="resSize" class="text-highlight"></span>
                </div>
            </div>

            <div class="mt-3">
                <strong>Output:</strong>
                <div class="output-box mt-2 p-3" id="resOutput"></div>
            </div>
            
            <hr class="my-4 border-light">

            <div class="d-flex flex-column align-items-center">
                <button class="btn btn-success custom-btn-success mb-3" id="storeBtn">
                    Store on Blockchain
                </button>
                <div class="w-100 text-center" id="txSection" style="display: none;">
                    <strong>Transaction Hash:</strong>
                    <div class="tx-hash-box p-2 mt-2" id="txHash"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
